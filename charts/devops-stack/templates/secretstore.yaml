{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "devops-stack.fullname" . }}-vault
  labels:
    {{- include "devops-stack.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.server | quote }}
      path: {{ .Values.externalSecrets.vault.kvPath | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.externalSecrets.vault.kubernetesMountPath | quote }}
          role: {{ .Values.externalSecrets.vault.role | quote }}
          serviceAccountRef:
            name: {{ include "devops-stack.fullname" . }}-eso
{{- end }}
