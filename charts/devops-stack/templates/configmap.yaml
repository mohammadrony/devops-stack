apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-stack.fullname" . }}-config
  labels:
    {{- include "devops-stack.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  SHUTDOWN_DELAY: {{ .Values.config.shutdownDelay | quote }}
