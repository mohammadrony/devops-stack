{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "devops-stack.fullname" . }}
  labels:
    {{- include "devops-stack.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "devops-stack.fullname" . }}-vault
    kind: SecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secret.key }}
      remoteRef:
        key: {{ .Values.externalSecrets.vault.secretPath }}
        property: {{ .Values.secret.key }}
{{- end }}
