services:
  app:
    build: ./app
    image: devops-stack:0.1.0
    container_name: devops-stack
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      APP_ENV: local
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
