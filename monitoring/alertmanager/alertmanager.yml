global:
  resolve_timeout: 5m

route:
  receiver: chat-alerts
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: chat-alerts
    slack_configs:
      - api_url_file: /tmp/webhook_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          {{ range .Alerts -}}
          *{{ .Annotations.summary }}*: {{ .Annotations.description }}
          {{ end }}
