---
- name: Harden host and deploy system health monitor
  hosts: all
  become: true
  vars:
    health_webhook_url: "{{ lookup('env', 'HEALTH_WEBHOOK_URL') | default('', true) }}"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - jq
          - openssh-server
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure SSH drop-in and runtime directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/ssh/sshd_config.d, mode: "0755" }
        - { path: /run/sshd, mode: "0755" }

    - name: Harden SSH daemon settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          X11Forwarding no
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload ssh

    - name: Allow SSH in firewall
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow service HTTP port in firewall
      community.general.ufw:
        rule: allow
        port: "8080"
        proto: tcp

    - name: Set default incoming firewall policy to deny
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Install system_health.sh script
      ansible.builtin.copy:
        src: ../scripts/system_health.sh
        dest: /usr/local/bin/system_health.sh
        owner: root
        group: root
        mode: "0755"

    - name: Configure optional health webhook environment file
      ansible.builtin.copy:
        dest: /etc/default/system-health
        owner: root
        group: root
        mode: "0600"
        content: |
          HEALTH_WEBHOOK_URL={{ health_webhook_url }}
      no_log: true

    - name: Ensure systemd override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/system-health.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure optional EnvironmentFile override for system-health service
      ansible.builtin.copy:
        dest: /etc/systemd/system/system-health.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile=-/etc/default/system-health
      notify: Reload systemd

    - name: Install systemd service unit for system health
      ansible.builtin.copy:
        src: ../scripts/systemd/system-health.service
        dest: /etc/systemd/system/system-health.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install systemd timer unit for system health
      ansible.builtin.copy:
        src: ../scripts/systemd/system-health.timer
        dest: /etc/systemd/system/system-health.timer
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Flush handlers before starting timer
      ansible.builtin.meta: flush_handlers

    - name: Enable and start system health timer
      ansible.builtin.systemd_service:
        name: system-health.timer
        enabled: true
        state: started

  handlers:
    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
