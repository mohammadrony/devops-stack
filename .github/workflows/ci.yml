name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Format & vet
        working-directory: app
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -d .
            exit 1
          fi
          go vet ./...

      - name: Unit tests & coverage
        working-directory: app
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Go Test Coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint-infra:
    name: Dockerfile, Shell, Infra, Configs & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile

      - name: Lint shell scripts (shellcheck)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: v0.11.0
          ignore_paths: terraform

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Format & validate Terraform
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Scan Terraform config (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          trivyignores: terraform/.trivyignore.yaml
          tf-vars: terraform/environments/staging.tfvars
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan Kubernetes manifests (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v4.3.1"

      - name: Lint Helm chart
        run: |
          helm lint charts/devops-stack
          helm lint charts/devops-stack -f charts/devops-stack/values-staging.yaml
          helm lint charts/devops-stack -f charts/devops-stack/values-production.yaml

      - name: Scan Helm chart (Trivy)
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 1 charts/devops-stack
          trivy config --helm-values charts/devops-stack/values-staging.yaml --severity HIGH,CRITICAL --exit-code 1 charts/devops-stack
          trivy config --helm-values charts/devops-stack/values-production.yaml --severity HIGH,CRITICAL --exit-code 1 charts/devops-stack

      - name: Validate Prometheus & Alertmanager configs
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.16.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.16.0 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint sh -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.35.0 -c 'printf "http://127.0.0.1:9999/disabled" > /tmp/webhook_url && exec amtool check-config /etc/alertmanager/alertmanager.yml'

      - name: Lint Ansible playbook (ansible-lint)
        uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          working_directory: ansible
          requirements_file: requirements.yml
          args: playbook.yml

      - name: Lint Markdown documentation
        run: |
          docker run --rm -v "$PWD:/workdir" ghcr.io/igorshubovych/markdownlint-cli:v0.50.0 README.md

  image-scan:
    name: Build & Trivy Scan
    needs: [lint-and-test, lint-infra]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          load: true
          tags: devops-stack:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (HIGH & CRITICAL summary)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devops-stack:pr-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devops-stack:pr-${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - name: Generate CycloneDX SBOM
        run: |
          trivy image --format cyclonedx --output sbom.cdx.json "devops-stack:pr-${{ github.sha }}"
          {
            echo "### CycloneDX SBOM"
            echo "Generated \`sbom.cdx.json\` with $(jq '.components | length' sbom.cdx.json) components."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-pr-${{ github.sha }}
          path: sbom.cdx.json

      - name: Set up Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify Cosign SBOM signing flow (ephemeral offline check)
        run: |
          COSIGN_PASSWORD="" cosign generate-key-pair
          COSIGN_PASSWORD="" cosign sign-blob --yes --key cosign.key --tlog-upload=false --output-signature sbom.cdx.sig sbom.cdx.json
          cosign verify-blob --key cosign.pub --signature sbom.cdx.sig --insecure-ignore-tlog sbom.cdx.json
          rm -f cosign.key cosign.pub sbom.cdx.sig
