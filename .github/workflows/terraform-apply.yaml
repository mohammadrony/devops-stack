name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      action:
        description: Terraform action
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy
      create_oidc_provider:
        description: Create account-level GitHub OIDC provider
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.environment }})
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Terraform init
        env:
          TF_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_ENV: ${{ inputs.environment }}
          TF_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform -chdir=terraform init -reconfigure -input=false \
            -backend-config="bucket=${TF_BUCKET}" \
            -backend-config="key=${TF_ENV}/terraform.tfstate" \
            -backend-config="region=${TF_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform ${{ inputs.action }}
        env:
          TF_ACTION: ${{ inputs.action }}
          TF_ENV: ${{ inputs.environment }}
          CREATE_OIDC: ${{ inputs.create_oidc_provider }}
        run: |
          case "$TF_ACTION" in
            plan)
              terraform -chdir=terraform plan -no-color -input=false \
                -var-file="environments/${TF_ENV}.tfvars" \
                -var="create_oidc_provider=${CREATE_OIDC}"
              ;;
            apply)
              terraform -chdir=terraform apply -no-color -input=false -auto-approve \
                -var-file="environments/${TF_ENV}.tfvars" \
                -var="create_oidc_provider=${CREATE_OIDC}"
              ;;
            destroy)
              terraform -chdir=terraform destroy -no-color -input=false -auto-approve \
                -var-file="environments/${TF_ENV}.tfvars" \
                -var="create_oidc_provider=${CREATE_OIDC}"
              ;;
          esac
